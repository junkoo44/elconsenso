<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>El Consenso — Asistente para Unanimo</title>
    
    <!-- Meta tags SEO y PWA -->
    <meta name="description" content="Asistente digital en mesa para jugar al Unanimo de forma presencial. Gestiona jugadores, tiempos y categorías." />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts: Outfit (Display) & Inter (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-space-dark text-white select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Registro del Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('Service Worker registrado con éxito:', reg.scope);
              
              // Escuchar si hay actualizaciones en segundo plano
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  // Si el nuevo service worker se instala y ya hay una versión previa controlando
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('SW: Nueva versión detectada. Recargando aplicación...');
                    window.location.reload();
                  }
                });
              });
            })
            .catch(err => console.warn('Fallo al registrar el Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
